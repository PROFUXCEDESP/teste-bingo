<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEDESP Bingo - Educador</title>
    <link rel="icon" href="assets/image/logo_cedesp.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
</head>
<body class="dashboard-body" id="educadorPage">

    <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="assets/image/logo_cedesp.png" alt="Logo CEDESP">
                <button class="close-sidebar-btn" id="closeSidebar"><span class="material-symbols-outlined">close</span></button>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item active" id="navMinhaTurma" onclick="mudarAbaEducador('secMinhaTurma', 'navMinhaTurma')"><span class="material-symbols-outlined nav-icon">groups</span> <span class="nav-text">Minha Turma</span></li>
                <li class="nav-item" id="navVendasGeral" onclick="mudarAbaEducador('secVendasGeral', 'navVendasGeral')"><span class="material-symbols-outlined nav-icon">bar_chart</span> <span class="nav-text">Vendas Geral</span></li>
                <li class="nav-item" id="navRankingEducandos" onclick="mudarAbaEducador('secRankingEducandos', 'navRankingEducandos')"><span class="material-symbols-outlined nav-icon">emoji_events</span> <span class="nav-text">Ranking Geral</span></li>
            </ul>
        </aside>

        <div class="main-panel">
            <header class="admin-header">
                <div class="header-left">
                    <button class="menu-toggle" id="openSidebar"><span class="material-symbols-outlined">menu</span></button>
                    <h1 class="admin-title">Área do Educador</h1>
                </div>
                <div class="user-profile"><span id="nomeEducador">...</span></div>
            </header>

            <main class="admin-container">
                <section id="secMinhaTurma">
                    <div style="margin-bottom:1.5rem; display:flex; gap:10px;">
                        <input type="text" id="buscaNomeAluno" class="purple-input" placeholder="Buscar aluno...">
                        <input type="hidden" id="filtroTurmaAluno" value="Todas">
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Pos.</th><th>Foto</th><th>Nome</th><th>Lotes</th><th>Venda</th><th>Pend.</th><th>Cartelas</th><th>Fone</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaAlunos"></tbody>
                        </table>
                    </div>
                </section>

                <section id="secRankingEducandos" style="display: none;">
                    <h2 class="section-title">Ranking Global</h2>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th class="text-center">Pos.</th>
                                    <th>Foto</th>
                                    <th>Nome do Educando</th>
                                    <th class="text-center">Lotes</th>
                                    <th class="text-center">Vendidos</th>
                                    <th class="text-center">Pendentes</th>
                                    <th class="text-center">Cartelas</th>
                                    <th class="text-center">Fone</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaRankingEducador"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
